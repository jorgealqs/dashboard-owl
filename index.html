<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Responsive: adapta el contenido al tamaño del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título del sitio (importante para SEO y pestañas del navegador) -->
    <title>Dashboard Personal</title>

    <!-- SEO Básico -->
    <meta name="description" content="Dashboard personal para gestión y análisis de datos.">
    <meta name="keywords" content="dashboard, análisis de datos, panel de control, gestión personal, visualización">
    <meta name="author" content="Jorge Alberto Quiroz Sierra">

    <!-- Etiquetas adicionales recomendadas para SEO -->
    <meta name="robots" content="index, follow"> <!-- Permite indexar y seguir enlaces -->
    <link rel="canonical" href="https://tusitio.com"> <!-- URL preferida para evitar contenido duplicado -->

    <!-- Open Graph: Mejora la visualización cuando se comparte en redes sociales -->
    <meta property="og:title" content="Dashboard Personal">
    <meta property="og:description" content="Un panel de control personal para visualización y análisis.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="URL_de_imagen.jpg"> <!-- Reemplaza con una imagen real -->
    <meta property="og:url" content="https://tusitio.com">
    <meta property="og:site_name" content="Dashboard Personal">

    <!-- Twitter Card: optimiza las vistas al compartir en Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dashboard Personal">
    <meta name="twitter:description" content="Un panel de control personal para visualización y análisis.">
    <meta name="twitter:image" content="URL_de_imagen.jpg">

    <!-- CSS de Tailwind (para estilos y componentes responsivos) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="./assets/tailwindcss/output.css"/>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Favicon (opcional pero recomendable) -->
    <link rel="icon" type="image/png" href="./assets/static/img/favicon.png">

    <!-- Css OWN -->
    <link rel="stylesheet" href="./assets/static/css/main.css"/>

</head>
<body class="bg-gradient-to-b from-blue-100 to-slate-100">

    <!-- Aquí puedes agregar tu contenido principal del dashboard -->

    <!-- JS de OWL o cualquier librería adicional -->
    <script src="./assets/static/js/libraries/owl.js"></script>

    <script type="module" src="./assets/static/js/main.js"></script>

</body>
</html>
